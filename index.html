<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Me & You | Wedding Invitation</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <main class="invitation">

  <!-- Animated background particles -->
  <div class="particles">
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
  </div>

  <div class="overlay"></div>

  <!-- Music Button -->
  <button
    class="music-button"
    id="musicBtn"
    aria-label="Play or pause music"
  >
    <span id="musicIcon">♫</span>
  </button>

  <!-- Decorative ornaments -->
  <div class="ornament top">
    ❧────────────❧
  </div>

  <div class="ornament bottom">
    ❧────────────❧
  </div>

  <!-- Elegant Wedding Invitation -->
  <section class="content">

    <div class="welcome-text">
      <span>AN ELEGANT WEDDING INVITATION</span>
    </div>

    <div class="arch">

      <div class="inner">

        <p class="eyebrow">
          WITH JOY IN OUR HEARTS
        </p>

        <h1>Me</h1>

        <div class="ampersand">
          &amp;
        </div>

        <h1>You</h1>

        <div class="divider">
          ──── ♡ ────
        </div>

        <p class="date">
          26 . 09 . 2026
        </p>

        <p class="tagline">
          Two hearts. One beautiful beginning.
        </p>

        <a href="invitation.html" class="proceed">
    PROCEED
    <span>→</span>
</a>

      </div>

    </div>

  </section>

  <footer>
    © 2026 Me &amp; You. All rights reserved.
  </footer>

  </main>


  <!-- Wedding Music -->
  <audio
    id="weddingMusic"
    src="dondo.mp3"
    loop
    preload="auto">
  </audio>


  <script src="script.js"></script>

</body>
</html>
